<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .canvas-area { cursor: crosshair; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0f111a] text-gray-200 h-screen flex flex-col overflow-hidden">
    <header class="border-b border-gray-800 px-6 py-3 flex justify-between items-center bg-[#161b22]">
        <div class="flex items-center gap-6">
            <h1 class="text-xl font-black tracking-widest text-white italic">PIXEL STUDIO</h1>
        </div>
        <div class="flex items-center gap-4">
            <button class="p-2 bg-gray-800 rounded-lg hover:bg-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
            <div class="w-10 h-10 bg-gradient-to-tr from-purple-500 to-blue-500 rounded-xl shadow-lg shadow-purple-500/20"></div>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        <aside class="w-64 bg-[#161b22] border-r border-gray-800 p-5 flex flex-col gap-6">
            <section>
                <label class="text-[10px] font-bold text-gray-500 tracking-widest uppercase mb-3 block">Source Image</label>
                <label for="imageInput" class="w-full py-3 bg-[#0d1117] border border-gray-700 rounded-lg text-sm hover:border-purple-500 transition-all flex flex-col items-center gap-2 cursor-pointer">
                    <span class="text-purple-400">Choose File</span>
                    <span class="text-[10px] text-gray-500">or Drag & Drop</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" class="hidden" />
            </section>

            <section class="space-y-4">
                <label class="text-[10px] font-bold text-gray-500 tracking-widest uppercase block">Engine Controls</label>

                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Pixelation Scale</label>
                    <select id="pixelScale" class="w-full bg-[#0d1117] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-purple-500 outline-none cursor-pointer">
                        <option value="1">1x (Original)</option>
                        <option value="2">2x Scale</option>
                        <option value="4" selected>4x Scale</option>
                        <option value="8">8x Scale</option>
                        <option value="16">16x Scale</option>
                        <option value="32">32x Scale</option>
                    </select>
                </div>

                <button id="applyPixelation" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-bold shadow-lg shadow-indigo-500/10 transition">Apply Pixelation</button>
                <button id="applyQuantization" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-bold shadow-lg shadow-emerald-500/10 transition">Apply Quantization</button>
            </section>

            <section class="mt-auto">
                <button id="clearWorkspace" class="w-full py-2 text-xs text-red-400 hover:bg-red-400/10 rounded-lg transition">Clear Workspace</button>
            </section>
        </aside>

        <section class="flex-1 bg-[#0d1117] relative flex items-center justify-center p-10 overflow-hidden">
            <div class="absolute top-6 flex gap-3">
                <button id="toggleGrid" class="px-4 py-1.5 bg-gray-800 rounded-full text-xs font-medium border border-gray-700 hover:bg-gray-700 transition">Grid: On</button>
                <button class="px-4 py-1.5 bg-gray-800 rounded-full text-xs font-medium border border-gray-700 hover:bg-gray-700 transition">Zoom: 200%</button>
            </div>

            <div class="canvas-area bg-gray-900 shadow-2xl relative border border-gray-800" style="width: 320px; height: 400px;">
                <div id="gridOverlay" class="absolute inset-0 pointer-events-none opacity-20"
                     style="background-image: linear-gradient(#4b5563 1px, transparent 1px), linear-gradient(90deg, #4b5563 1px, transparent 1px); background-size: 20px 20px;">
                </div>
                <canvas id="canvas" class="w-full h-full"></canvas>
                <div class="flex items-center justify-center h-full text-gray-700 text-xs italic uppercase tracking-widest absolute inset-0 pointer-events-none">
                    Canvas Area
                </div>
            </div>

            <div class="absolute bottom-10 flex bg-[#161b22] border border-gray-700 rounded-xl divide-x divide-gray-700 shadow-2xl">
                <button class="p-3 hover:bg-gray-800 transition rounded-l-xl">—</button>
                <button class="p-3 hover:bg-gray-800 transition">Reset</button>
                <button class="p-3 hover:bg-gray-800 transition rounded-r-xl">+</button>
            </div>
        </section>

        <aside class="w-72 bg-[#161b22] border-l border-gray-800 p-5 flex flex-col gap-6">
            <section>
                <div class="flex justify-between items-center mb-4">
                    <label class="text-[10px] font-bold text-gray-500 tracking-widest uppercase">Palette</label>
                    <span id="colorCount" class="text-[10px] px-2 py-0.5 bg-purple-500/20 text-purple-400 rounded-full border border-purple-500/30">Colors: 0</span>
                </div>

                <div id="palette" class="grid grid-cols-4 gap-2">
                    <!-- Palette colors will be added here dynamically -->
                </div>
            </section>

            <section class="bg-[#0d1117] border border-gray-800 rounded-xl overflow-hidden shadow-inner">
                <details open class="group">
                    <summary class="flex justify-between items-center p-3 cursor-pointer select-none">
                        <span class="text-[10px] font-bold tracking-widest text-gray-400">IMAGE INFO</span>
                        <svg class="h-3 w-3 transition group-open:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 9l-7 7-7-7" /></svg>
                    </summary>
                    <div class="px-3 pb-3 space-y-2 text-[11px]">
                        <div class="flex justify-between">
                            <span class="text-gray-500">Dimensions</span>
                            <span id="imageDimensions" class="font-mono text-blue-400">-</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">File Type</span>
                            <span class="font-mono text-blue-400">-</span>
                        </div>
                    </div>
                </details>
            </section>

            <div class="mt-auto space-y-3">
                <button id="savePalette" class="w-full py-2 bg-blue-600/10 text-blue-400 border border-blue-600/30 rounded-lg text-xs hover:bg-blue-600 hover:text-white transition">Save Palette</button>
                <button class="w-full py-2 bg-gray-800 text-gray-300 border border-gray-700 rounded-lg text-xs hover:bg-gray-700 transition font-medium">Export (.GPL)</button>
            </div>
        </aside>
    </main>

    <!-- Color Info Modal (hidden by default) -->
    <div id="colorInfoModal" class="hidden fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-[#161b22] border border-gray-700 rounded-lg px-4 py-2 text-xs z-50">
        <div class="flex gap-4">
            <div>
                <div class="text-gray-400">R: <span id="colorR">-</span></div>
                <div class="text-gray-400">G: <span id="colorG">-</span></div>
                <div class="text-gray-400">B: <span id="colorB">-</span></div>
            </div>
            <div>
                <div class="text-gray-400">HEX: <span id="colorHex">-</span></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
