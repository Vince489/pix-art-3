<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>PixArt</title>
</head>
<body class="bg-[#0d1117] h-screen flex flex-col m-0 p-0">
    <script>
        // Upload handling is now in script.js
    </script>

    <!-- File input element for image upload -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;">

    <header class="h-16 w-full border-b border-zinc-800 bg-[#161b22] shrink-0">
    </header>

    <div class="flex flex-1 overflow-hidden">

        <aside class="w-64 border-r border-zinc-800 bg-[#161b22] shrink-0 p-4">
            <div class="flex flex-col h-full">
                <div class="mb-4">
                    <button id="uploadImageBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-3 rounded text-sm transition-colors">
                        Upload Image
                    </button>
                </div>

                <div class="mb-4">
                    <h3 class="text-blue-400 text-sm font-medium mb-2">Image Processing</h3>
                    <div class="space-y-2">
                        <div>
                            <label for="pixelScale" class="block text-sm text-zinc-300 mb-1">Pixelation Scale</label>
                            <select id="pixelScale" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-sm text-zinc-300">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5" selected>5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </div>
                        <button id="applyPixelation" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-2 px-3 rounded text-sm transition-colors">Apply Pixelation</button>
                        <button id="applyQuantization" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-2 px-3 rounded text-sm transition-colors">Apply Quantization</button>
                        <button id="downloadImage" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-3 rounded text-sm transition-colors">Download Image</button>
                    </div>
                </div>
            </div>
        </aside>

<main class="flex-1 bg-[#0d1117] overflow-y-auto flex items-center justify-center p-4">
    <canvas id="canvas" class="max-w-full max-h-full bg-gray-800 rounded"></canvas>
</main>

        <!-- Right Sidebar -->
        <aside class="w-64 border-l border-zinc-800 bg-[#161b22] shrink-0 p-4 overflow-y-auto">
            <div class="space-y-6">
                <div>
                    <h2 class="text-blue-400 text-sm font-medium mb-3">Generated Palette</h2>
                    <div id="palette" class="flex flex-wrap gap-2 bg-zinc-800 p-3 rounded-lg min-h-32 w-full">
                        <!-- Palette colors will be added here dynamically -->
                    </div>
                </div>

                <div>
                    <h3 class="text-blue-400 text-sm font-medium mb-2">Select a Palette</h3>
                    <select id="loadPalette" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-sm text-zinc-300">
                        <option value="">-- Select a Palette --</option>
                    </select>
                </div>

                <div>
                    <h3 class="text-blue-400 text-sm font-medium mb-2">Create a Palette</h3>
                    <input type="text" id="paletteName" placeholder="Enter new palette name" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-sm text-zinc-300 placeholder-zinc-500 mb-3">

                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <button id="savePalette" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-3 rounded text-sm transition-colors">Save</button>
                        <button id="deletePalette" class="bg-red-600 hover:bg-red-700 text-white py-2 px-3 rounded text-sm transition-colors">Delete</button>
                    </div>
                    <button id="addColor" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 px-3 rounded text-sm transition-colors mt-2">Add Color</button>
                </div>

                <div>
                    <h3 class="text-blue-400 text-sm font-medium mb-2">Image Information</h3>
                    <div class="bg-zinc-800 p-3 rounded-lg">
                        <div class="space-y-2 text-sm text-zinc-300">
                            <div class="flex justify-between">
                                <span>Dimensions:</span>
                                <span id="imageDimensions">-</span>
                            </div>
                            <div class="flex justify-between">
                                <span>Colors in palette:</span>
                                <span id="colorCount">0</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </aside>

    </div>

    <script src="/script.js"></script>
</body>
</html>
