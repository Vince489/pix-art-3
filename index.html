<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>PixArt</title>
    <style>
        /* Spinner styles */
        .spinner {
            display: none !important;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(38, 43, 51, 0.8);
            z-index: 10;
            border-radius: 8px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner.active {
            display: flex !important;
        }

        .spinner-animation {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner-text {
            color: #9ca3af;
            font-size: 0.875rem;
            margin-top: 0.75rem;
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            .sidebar-left {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 50;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                width: 280px;
            }

            .sidebar-left.open {
                transform: translateX(0);
            }

            .sidebar-right {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                z-index: 50;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                width: 280px;
            }

            .sidebar-right.open {
                transform: translateX(0);
            }

            .main-content {
                width: 100%;
            }

            .mobile-toggle {
                display: block;
            }

            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 40;
                display: none;
            }

            .overlay.active {
                display: block;
            }
        }

        @media (min-width: 769px) {
            .mobile-toggle {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-[#0d1117] h-screen flex flex-col m-0 p-0">
    <script>
        // Upload handling is now in script.js
    </script>

    <!-- File input element for image upload -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;">

    <header class="h-16 w-full border-b border-zinc-800 bg-[#161b22] shrink-0 flex items-center justify-between">
        <div class="flex items-center pl-6">
            <button id="leftSidebarToggle" class="mobile-toggle mr-4 p-2 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>
            <h1 class="text-xl font-black tracking-widest text-white italic">PIXART STUDIO</h1>
            <span id="performanceMetrics" class="ml-4 text-sm text-zinc-400 hidden"></span>
        </div>
        <div class="pr-6 flex items-center">
            <button id="rightSidebarToggle" class="mobile-toggle mr-4 p-2 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 4.5l7.5 7.5-7.5 7.5m-6-15l7.5 7.5-7.5 7.5" />
                </svg>
            </button>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.0" stroke="currentColor" class="size-11 text-white">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Overlay for mobile sidebars -->
        <div id="overlay" class="overlay"></div>

        <aside id="leftSidebar" class="w-64 border-r border-zinc-800 bg-[#161b22] shrink-0 p-6 sidebar-left">
            <div class="flex flex-col h-full space-y-8">
                <div>
                    <button id="uploadImageBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2.5 px-4 rounded-md shadow-sm transition-all active:scale-95">
                        Upload Image
                    </button>
                </div>

                <div class="space-y-4">
                    <h3 class="text-zinc-400 text-xs font-semibold uppercase tracking-wider">Image Processing</h3>

                    <div class="bg-zinc-800/50 p-3 rounded-lg border border-zinc-700/50">
                        <label for="pixelScale" class="block text-xs text-zinc-400 mb-2">Pixelation Scale</label>
                        <select id="pixelScale" class="w-full bg-zinc-900 border border-zinc-700 rounded-md p-2 text-sm text-zinc-200 outline-none focus:border-blue-500 transition-colors">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-4 pt-2">
                        <button id="applyPixelation" class="w-full bg-zinc-700 hover:bg-zinc-600 text-white text-sm font-medium py-2 px-3 rounded-md transition-colors">
                            Apply Pixelation
                        </button>
                        <button id="applyQuantization" class="w-full bg-zinc-700 hover:bg-zinc-600 text-white text-sm font-medium py-2 px-3 rounded-md transition-colors">
                            Apply Quantization
                        </button>
                        <button id="autoGeneratePalette" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2 px-3 rounded-md transition-colors">
                            Auto-Generate Palette
                        </button>
                        <button id="clearWorkspace" class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 px-3 rounded-md transition-colors">
                            Clear Workspace
                        </button>
                        <button id="downloadImage" class="w-full border border-blue-600/50 text-blue-400 hover:bg-blue-600/10 text-sm font-medium py-2 px-3 rounded-md transition-all">
                            Download Image
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <main id="mainContent" class="flex-1 bg-[#0d1117] overflow-y-auto flex items-center justify-center p-4 main-content">
            <canvas id="canvas" class="max-w-full max-h-full bg-gray-800 rounded"></canvas>
        </main>

        <!-- Right Sidebar -->
        <aside id="rightSidebar" class="w-64 border-l border-zinc-800 bg-[#161b22] shrink-0 p-4 overflow-y-auto sidebar-right">
            <div class="space-y-6">
                <div class="relative">
                    <h2 class="text-blue-400 text-sm font-medium mb-3">Generated Palette</h2>
                    <button id="clearPalette" class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 px-3 rounded-md transition-colors mb-3 hidden">
                        Clear Palette
                    </button>
                    <div id="palette" class="flex flex-wrap gap-2 bg-zinc-800 p-3 rounded-lg min-h-32 w-full" style="position: relative;">
                        <!-- Palette colors will be added here dynamically -->
                        <div id="paletteSpinner" class="spinner">
                            <div class="spinner-animation"></div>
                            <div class="spinner-text">Generating palette...</div>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-blue-400 text-sm font-medium mb-2">Select a Palette</h3>
                    <select id="loadPalette" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-sm text-zinc-300">
                        <option value="">-- Select a Palette --</option>
                    </select>
                </div>

                <div>
                    <h3 class="text-blue-400 text-sm font-medium mb-2">Create a Palette</h3>
                    <input type="text" id="paletteName" placeholder="Enter new palette name" class="w-full bg-zinc-800 border border-zinc-700 rounded p-2 text-sm text-zinc-300 placeholder-zinc-500 mb-3">

                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <button id="savePalette" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-3 rounded-md transition-colors">Save</button>
                        <button id="deletePalette" class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 px-3 rounded-md transition-colors">Delete</button>
                    </div>
                    <button id="addColor" class="w-full bg-green-600 hover:bg-green-700 text-white text-sm font-medium py-2 px-3 rounded-md transition-colors mt-2">
                        Add Color
                    </button>
                </div>

                <div>
                    <h3 class="text-blue-400 text-sm font-medium mb-2">Image Information</h3>
                    <div class="bg-zinc-800 p-3 rounded-lg">
                        <div class="space-y-2 text-sm text-zinc-300">
                            <div class="flex justify-between">
                                <span>Dimensions:</span>
                                <span id="imageDimensions">-</span>
                            </div>
                            <div class="flex justify-between">
                                <span>Colors in palette:</span>
                                <span id="colorCount">0</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </aside>

    </div>

    <script src="/script.js"></script>
</body>
</html>
